[project]
name = "ps5-local-storefront"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "pystray>=0.19",  # tray icon (launcher.py)
  "pillow>=10",
  "cryptography>=43",  # Fernet for console credentials
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pyftpdlib>=2"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
